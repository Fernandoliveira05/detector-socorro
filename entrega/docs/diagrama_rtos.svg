<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#0f1420"/>
  <text x="480" y="34" fill="#e6edf3" font-size="22" font-weight="bold" text-anchor="middle">Detector de "Socorro" — Arquitetura FreeRTOS (ESP32 + INMP441)</text>

  <!-- INMP441 -->
  <rect x="30" y="90" width="130" height="70" rx="8" fill="#1f2a3a" stroke="#3b82f6"/>
  <text x="95" y="120" fill="#e6edf3" font-size="14" text-anchor="middle">INMP441</text>
  <text x="95" y="140" fill="#9fb3c8" font-size="11" text-anchor="middle">mic I2S</text>

  <!-- T1 -->
  <rect x="210" y="80" width="200" height="92" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="310" y="106" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">T1 · Captura (I2S)</text>
  <text x="310" y="128" fill="#c7f9cc" font-size="11" text-anchor="middle">prioridade ALTA (5) · core 0</text>
  <text x="310" y="146" fill="#9fb3c8" font-size="11" text-anchor="middle">lê blocos de ~62ms</text>
  <text x="310" y="162" fill="#9fb3c8" font-size="11" text-anchor="middle">escreve no buffer circular</text>

  <!-- Buffer circular -->
  <rect x="470" y="90" width="200" height="72" rx="10" fill="#1f2a3a" stroke="#eab308" stroke-width="2"/>
  <text x="570" y="118" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">Buffer circular</text>
  <text x="570" y="138" fill="#9fb3c8" font-size="11" text-anchor="middle">2 s · float[32000]</text>
  <text x="570" y="154" fill="#fde68a" font-size="11" text-anchor="middle">🔒 ringMutex</text>

  <!-- T2 -->
  <rect x="380" y="250" width="220" height="110" rx="10" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
  <text x="490" y="276" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">T2 · Extração de Features</text>
  <text x="490" y="298" fill="#bae6fd" font-size="11" text-anchor="middle">prioridade MÉDIA (3) · core 1</text>
  <text x="490" y="316" fill="#9fb3c8" font-size="11" text-anchor="middle">janela 1s → RMS (gate)</text>
  <text x="490" y="332" fill="#9fb3c8" font-size="11" text-anchor="middle">→ MFCC (49×16)</text>
  <text x="490" y="348" fill="#9fb3c8" font-size="11" text-anchor="middle">envia p/ fila</text>

  <!-- T3 -->
  <rect x="380" y="430" width="220" height="104" rx="10" fill="#3f1d38" stroke="#e879f9" stroke-width="2"/>
  <text x="490" y="456" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">T3 · Detecção de Anomalia</text>
  <text x="490" y="478" fill="#f5d0fe" font-size="11" text-anchor="middle">prioridade BAIXA (2) · core 1</text>
  <text x="490" y="496" fill="#9fb3c8" font-size="11" text-anchor="middle">TFLite Micro (int8)</text>
  <text x="490" y="512" fill="#9fb3c8" font-size="11" text-anchor="middle">threshold 0.85 + debounce 3</text>

  <!-- Alerta -->
  <rect x="700" y="440" width="150" height="84" rx="10" fill="#3a1f1f" stroke="#ef4444" stroke-width="2"/>
  <text x="775" y="470" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">Alerta</text>
  <text x="775" y="492" fill="#fecaca" font-size="11" text-anchor="middle">LED (GPIO2)</text>
  <text x="775" y="508" fill="#fecaca" font-size="11" text-anchor="middle">Buzzer (GPIO27)</text>

  <!-- setas -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- INMP441 -> T1 -->
  <line x1="160" y1="125" x2="205" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <!-- T1 -> buffer -->
  <line x1="410" y1="126" x2="465" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <!-- buffer -> T2 (leitura) -->
  <line x1="560" y1="162" x2="510" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <!-- T1 -> T2 semáforo -->
  <line x1="300" y1="172" x2="430" y2="248" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="300" y="228" fill="#86efac" font-size="11">blockSem (semáforo)</text>
  <!-- T2 -> T3 fila -->
  <line x1="490" y1="360" x2="490" y2="426" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
  <text x="500" y="398" fill="#7dd3fc" font-size="11">featQueue (fila, 4 itens)</text>
  <!-- T3 -> alerta -->
  <line x1="600" y1="486" x2="696" y2="484" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- legenda -->
  <text x="30" y="500" fill="#9fb3c8" font-size="11">Legenda:</text>
  <line x1="90" y1="496" x2="120" y2="496" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="125" y="500" fill="#9fb3c8" font-size="11">semáforo</text>
  <line x1="185" y1="496" x2="215" y2="496" stroke="#38bdf8" stroke-width="2"/>
  <text x="220" y="500" fill="#9fb3c8" font-size="11">fila</text>
  <text x="260" y="500" fill="#fde68a" font-size="11">🔒 mutex protege o buffer</text>
  <text x="30" y="524" fill="#64748b" font-size="10">Preempção por prioridade: T1 &gt; T2 &gt; T3. Seções críticas curtas no buffer via mutex evitam corrida entre T1 (escrita) e T2 (leitura).</text>
</svg>
